<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}POSHub Cloud Store{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='assets/favicon.svg') }}" type="image/svg+xml">
</head>
<body>
    <header>
        <a href="{{ url_for('home') }}" class="logo">
            <svg class="brand-mark" viewBox="0 0 64 64"><rect x="6" y="10" width="52" height="44" rx="11" fill="#84CC16"/><rect x="16" y="26" width="32" height="7" rx="3.5" fill="#0A0A0A"/><rect x="16" y="38" width="20" height="5" rx="2.5" fill="#0A0A0A" opacity="0.55"/></svg>
            POS<span class="brand-hub">Hub</span>
        </a>
        <nav>{% block nav %}{% endblock %}</nav>
    </header>

    <section>
        <div class="section-title">{% block section_title %}{% endblock %}</div>
        <div class="section-subtitle">{% block section_subtitle %}{% endblock %}</div>
        <div class="form-card" style="{% block card_style %}{% endblock %}">
            {% block form %}{% endblock %}
        </div>
    </section>

    <footer>
        <p>POSHub Cloud Store | Azure Cloud E-Commerce Prototype | DevOps Final Project</p>
    </footer>
</body>
</html>
