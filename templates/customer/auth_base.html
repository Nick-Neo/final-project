<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}POSHub Cloud Store{% endblock %}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background: #f4f7fb; color: #1f2937; min-height: 100vh; display: flex; flex-direction: column; }
        header { background: #0f172a; color: white; padding: 18px 40px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; }
        .logo { font-size: 24px; font-weight: bold; color: #fff; text-decoration: none; }
        nav a { color: white; text-decoration: none; margin-left: 20px; font-size: 14px; }
        nav a:hover { color: #38bdf8; }
        section { padding: 50px 40px; flex: 1; }
        .section-title { text-align: center; font-size: 30px; margin-bottom: 10px; color: #0f172a; }
        .section-subtitle { text-align: center; color: #6b7280; margin-bottom: 35px; }
        .form-card { max-width: 420px; margin: 20px auto 0; background: white; padding: 30px; border-radius: 16px; box-shadow: 0 5px 15px rgba(0,0,0,0.08); }
        .form-card label { display: block; margin-bottom: 4px; font-size: 14px; }
        .form-card input[type="email"],
        .form-card input[type="password"],
        .form-card input[type="text"] { display: block; width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; }
        .btn { background: #38bdf8; color: #0f172a; padding: 12px 22px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; text-decoration: none; display: inline-block; width: 100%; text-align: center; font-size: 15px; }
        .btn:hover { background: #7dd3fc; }
        .form-footer { text-align: center; margin-top: 14px; color: #6b7280; font-size: 14px; }
        .form-footer a { color: #2563eb; text-decoration: none; }
        footer { background: #0f172a; color: white; text-align: center; padding: 25px; margin-top: auto; }
    </style>
</head>
<body>
    <header>
        <a href="{{ url_for('home') }}" class="logo">POSHub Cloud Store</a>
        <nav>{% block nav %}{% endblock %}</nav>
    </header>

    <section>
        <div class="section-title">{% block section_title %}{% endblock %}</div>
        <div class="section-subtitle">{% block section_subtitle %}{% endblock %}</div>
        <div class="form-card" style="{% block card_style %}{% endblock %}">
            {% block form %}{% endblock %}
        </div>
    </section>

    <footer>
        <p>POSHub Cloud Store | Azure Cloud E-Commerce Prototype | DevOps Final Project</p>
    </footer>
</body>
</html>
