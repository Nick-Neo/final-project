<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>Add Product</title>

        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
                font-family:
                    -apple-system,
                    BlinkMacSystemFont,
                    "Segoe UI",
                    Roboto,
                    sans-serif;
            }

            body {
                background: #f1f5f9;
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
                padding: 20px;
            }

            .container {
                width: 100%;
                max-width: 650px;
                background: white;
                border-radius: 16px;
                padding: 40px;
                box-shadow: 0 8px 25px rgba(0,0,0,0.08);
            }

            h1 {
                font-size: 32px;
                margin-bottom: 10px;
                color: #0f172a;
            }

            .subtitle {
                color: #64748b;
                margin-bottom: 35px;
                font-size: 15px;
            }

            .form-group {
                margin-bottom: 24px;
            }

            label {
                display: block;
                margin-bottom: 8px;
                font-weight: 600;
                color: #1e293b;
            }

            input,
            textarea {
                width: 100%;
                padding: 14px 16px;
                border: 1px solid #cbd5e1;
                border-radius: 10px;
                font-size: 15px;
                transition: 0.2s;
                background: #fff;
            }

            input:focus,
            textarea:focus {
                outline: none;
                border-color: #2563eb;
                box-shadow: 0 0 0 4px rgba(37,99,235,0.15);
            }

            textarea {
                resize: vertical;
                min-height: 120px;
            }

            .row {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 20px;
            }

            .upload-box {
                border: 2px dashed #cbd5e1;
                border-radius: 12px;
                padding: 30px;
                text-align: center;
                background: #f8fafc;
            }

            .upload-box input {
                border: none;
                background: none;
                padding: 0;
            }

            .submit-btn {
                width: 100%;
                padding: 16px;
                background: #2563eb;
                color: white;
                border: none;
                border-radius: 12px;
                font-size: 16px;
                font-weight: 600;
                cursor: pointer;
                transition: 0.2s;
            }

            .submit-btn:hover {
                background: #1d4ed8;
            }

            .back-link {
                display: inline-block;
                margin-top: 20px;
                text-decoration: none;
                color: #64748b;
                font-size: 14px;
            }

            .back-link:hover {
                color: #2563eb;
            }

            @media (max-width: 768px) {
                .row {
                    grid-template-columns: 1fr;
                }

                .container {
                    padding: 25px;
                }
            }
        </style>
    </head>

    <body>

        <div class="container">

            <h1>📦 Add Product</h1>

            <p class="subtitle">
                Create and upload a new product into the POSHub inventory system.
            </p>

            <form method="POST" enctype="multipart/form-data">

                <div class="form-group">

                    <label>Product Name</label>

                    <input
                        type="text"
                        name="item_name"
                        placeholder="Enter product name"
                        required
                    >

                </div>

                <div class="form-group">

                    <label>Product Description</label>

                    <textarea
                        name="description"
                        placeholder="Enter detailed product description"
                    ></textarea>

                </div>

                <div class="row">

                    <div class="form-group">

                        <label>Quantity</label>

                        <input
                            type="number"
                            name="quantity"
                            placeholder="0"
                            min="0"
                            required
                        >

                    </div>

                    <div class="form-group">

                        <label>Price ($)</label>

                        <input
                            type="number"
                            step="0.01"
                            name="price"
                            placeholder="0.00"
                            required
                        >

                    </div>

                </div>

                <div class="form-group">

                    <label>Product Image</label>

                    <div class="upload-box">

                        <input
                            type="file"
                            name="image"
                            accept="image/*"
                            required
                        >

                    </div>

                </div>

                <button type="submit" class="submit-btn">
                    Upload Product
                </button>

            </form>

            <a href="{{ url_for('admin_dashboard') }}" class="back-link">
                ← Back to Dashboard
            </a>

        </div>

    </body>
</html>
