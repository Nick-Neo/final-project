<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Internal Access Terminal — POSHub Admin</title>
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                    sans-serif;
            }
            body {
                background-color: #0f172a;
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                color: #f8fafc;
            }
            .login-card {
                background: #1e293b;
                width: 100%;
                max-width: 400px;
                padding: 40px 30px;
                border-radius: 8px;
                box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
                border: 1px solid #334155;
            }
            .badge {
                background: #38bdf8;
                color: #0f172a;
                text-transform: uppercase;
                font-size: 11px;
                font-weight: 800;
                padding: 4px 8px;
                border-radius: 4px;
                display: inline-block;
                margin-bottom: 12px;
                letter-spacing: 0.05em;
            }
            h1 {
                font-size: 24px;
                font-weight: 600;
                margin-bottom: 6px;
                color: #ffffff;
            }
            p.subtitle {
                color: #94a3b8;
                font-size: 14px;
                margin-bottom: 28px;
            }
            .error-banner {
                background: #ef4444;
                color: white;
                padding: 12px;
                border-radius: 6px;
                font-size: 14px;
                margin-bottom: 20px;
                text-align: center;
                font-weight: 500;
            }
            label {
                display: block;
                font-size: 12px;
                font-weight: 600;
                text-transform: uppercase;
                color: #94a3b8;
                margin-bottom: 6px;
                letter-spacing: 0.02em;
            }
            input {
                width: 100%;
                background: #0f172a;
                border: 1px solid #475569;
                padding: 12px;
                border-radius: 6px;
                color: white;
                font-size: 15px;
                margin-bottom: 20px;
                outline: none;
                transition: border-color 0.2s;
            }
            input:focus {
                border-color: #38bdf8;
            }
            button {
                width: 100%;
                background: #38bdf8;
                color: #0f172a;
                border: none;
                padding: 14px;
                border-radius: 6px;
                font-weight: 600;
                font-size: 15px;
                cursor: pointer;
                transition: background 0.2s;
            }
            button:hover {
                background: #7dd3fc;
            }
            .footer-link {
                display: block;
                text-align: center;
                margin-top: 24px;
                font-size: 13px;
                color: #64748b;
                text-decoration: none;
            }
            .footer-link:hover {
                color: #94a3b8;
            }
        </style>
    </head>
    <body>
        <div class="login-card">
            <span class="badge">Administrative Gateway</span>
            <h1>POSHub Control Center</h1>
            <p class="subtitle">
                Please sign in to manage system infrastructure.
            </p>

            {% if error %}
            <div class="error-banner">{{ error }}</div>
            {% endif %}

            <form method="post" action="{{ url_for('admin_login') }}">
                <label>System Username / Email</label>
                <input
                    type="email"
                    name="email"
                    placeholder="admin@poshub.com"
                    required
                    autocomplete="off"
                />

                <label>Security Password</label>
                <input
                    type="password"
                    name="password"
                    placeholder="••••••••"
                    required
                />

                <button type="submit">Authorize Connection</button>
            </form>

            <a href="{{ url_for('home') }}" class="footer-link"
                >← Return to Public Storefront</a
            >
        </div>
    </body>
</html>
