# 1. This tells Azure Pipelines to watch your GitHub repository's main branch
trigger:
  branches:
    include:
      - main
pool:
  name: Default
 
variables:
  azureServiceConnection: 'Azure-Subscription-Conn'
  acrName: 'finalproject26'
  aksCluster: 'epos'
  resourceGroup: 'final-project'
  imageName: 'epos-final-project'
 
steps:
- checkout: self  # Natively pulls down your GitHub source files
 
# 2. Log in to ACR, Build the Docker image, and Push it
- task: AzureCLI@2
  displayName: 'Docker Build and Push to ACR'
  inputs:
    azureSubscription: $(azureServiceConnection)
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      az acr login --name $(acrName)

      docker build -t $(acrName).azurecr.io/$(imageName):$(Build.BuildId) .

      docker push $(acrName).azurecr.io/$(imageName):$(Build.BuildId)

- script: |
    sudo apt-get update
    sudo apt-get install -y unzip
  displayName: 'Install unzip'

# 3. Securely pull down the necessary tools to communicate with AKS non-interactively
- task: KubeloginInstaller@0
  displayName: 'Install Kubelogin'
  inputs:
    kubeloginVersion: 'latest'
 
# 4. Connect to AKS and Deploy your app manifests
- task: AzureCLI@2
  displayName: 'Deploy to AKS'
  inputs:
    azureSubscription: $(azureServiceConnection)
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      az aks get-credentials \
        --resource-group $(resourceGroup) \
        --name $(aksCluster) \
        --overwrite-existing

      kubelogin convert-kubeconfig -l azurecli

      kubectl get namespace epos-project || kubectl create namespace epos-project

      kubectl create secret generic epos-app-secrets \
        --namespace epos-project \
        --from-literal=gunicorn-secret-key="$(appSecretKey)" \
        --dry-run=client -o yaml | kubectl apply -f -

      kubectl apply -f deployment.yaml -n epos-project
      
      kubectl set image deployment/epos-deployment epos-container=$(acrName).azurecr.io/$(imageName):$(Build.BuildId) -n epos-project

      kubectl rollout restart deployment/epos-deployment -n epos-project