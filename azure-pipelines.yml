# 1. This tells Azure Pipelines to watch your GitHub repository's main branch
trigger:
  branches:
    include:
      - main
pool:
  name: Default
 
variables:
  azureServiceConnection: 'Azure-Subscription-Conn'
  acrName: 'finalproject26'
  aksCluster: 'epos'
  resourceGroup: 'final-project'
  imageName: 'epos-final-project'
 
steps:
- checkout: self  # Natively pulls down your GitHub source files
 
# 2. Log in to ACR, Build the Docker image, and Push it
- task: AzureCLI@2
  displayName: 'Docker Build and Push to ACR'
  inputs:
    azureSubscription: $(azureServiceConnection)
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      az acr login --name $(acrName)

      docker build -t $(acrName).azurecr.io/$(imageName):$(Build.BuildId) .

      docker push $(acrName).azurecr.io/$(imageName):$(Build.BuildId)

- script: |
    sudo apt-get update
    sudo apt-get install -y unzip
  displayName: 'Install unzip'

# 3. Securely pull down the necessary tools to communicate with AKS non-interactively
- task: KubeloginInstaller@0
  displayName: 'Install Kubelogin'
  inputs:
    kubeloginVersion: 'latest'
 
# 4. Connect to AKS and Deploy your app manifests
- task: AzureCLI@2
  displayName: 'Deploy to AKS'
  inputs:
    azureSubscription: $(azureServiceConnection)
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      az aks get-credentials \
        --resource-group $(resourceGroup) \
        --name $(aksCluster) \
        --overwrite-existing

      kubelogin convert-kubeconfig -l azurecli

      kubectl get namespace epos-project || kubectl create namespace epos-project

      if [ -z "$APP_SECRET_KEY" ]; then
        echo "ERROR: appSecretKey is empty"
        exit 1
      fi

      kubectl create secret generic epos-app-secrets \
        --namespace epos-project \
        --from-literal=SECRET_KEY="$APP_SECRET_KEY" \
        --from-literal=DB_HOST="$DB_HOST" \
        --from-literal=DB_PORT="$DB_PORT" \
        --from-literal=DB_NAME="$DB_NAME" \
        --from-literal=DB_USER="$DB_USER" \
        --from-literal=DB_PASSWORD="$DB_PASSWORD" \
        --from-literal=AZURE_STORAGE_CONNECTION_STRING="$AZURE_STORAGE_CONNECTION_STRING" \
        --from-literal=AZURE_CONTAINER_NAME="$AZURE_CONTAINER_NAME" \
        --from-literal=STRIPE_SECRET_KEY="$STRIPE_SECRET_KEY" \
        --from-literal=STRIPE_WEBHOOK_SECRET="$STRIPE_WEBHOOK_SECRET" \
        --dry-run=client -o yaml | kubectl apply -f -

      kubectl apply -f deployment.yaml -n epos-project

      kubectl set image deployment/flask-ecom-deployment \
        ecom-container=$(acrName).azurecr.io/$(imageName):$(Build.BuildId) \
        -n epos-project

      kubectl rollout restart deployment/flask-ecom-deployment -n epos-project

  env:
    APP_SECRET_KEY: $(appSecretKey)
    DB_HOST: $(DB_HOST)
    DB_PORT: $(DB_PORT)
    DB_NAME: $(DB_NAME)
    DB_USER: $(DB_USER)
    DB_PASSWORD: $(DB_PASSWORD)
    AZURE_STORAGE_CONNECTION_STRING: $(azureStorageConnectionString)
    AZURE_CONTAINER_NAME: $(azureContainerName)
    STRIPE_SECRET_KEY: $(stripeSecretKey)
    STRIPE_WEBHOOK_SECRET: $(stripeWebhookSecret)