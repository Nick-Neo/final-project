apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-ecom-deployment
  namespace: epos-project
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-ecom
  template:
    metadata:
      labels:
        app: flask-ecom
    spec:
      containers:
        - name: ecom-container
          image: finalproject26.azurecr.io/epos-final-project:V1
          ports:
            - containerPort: 8000
            
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: epos-app-secrets
                  key: SECRET_KEY

            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: epos-app-secrets
                  key: DB_HOST
        
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: epos-app-secrets
                  key: DB_PORT
        
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: epos-app-secrets
                  key: DB_NAME

            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: epos-app-secrets
                  key: DB_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: epos-app-secrets
                  key: DB_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: epos-final-project-service
  namespace: epos-project
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 8000
  selector:
    app: flask-ecom